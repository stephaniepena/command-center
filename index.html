<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Command Center</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #1c1c1e; --ink-2: #48484a; --ink-3: #8e8e93;
  --paper: #faf9f6; --paper-2: #f2f0eb; --paper-3: #e8e5de;
  --rule: #dedad2; --accent: #48535b; --accent-light: #e8eced;
  --urgent-bg: #fdf0ed; --urgent-text: #7a2e1a; --urgent-border: #f0c4b4;
  --work-bg: #edf3fb; --work-text: #1a4a7a; --work-border: #c0d8f5;
  --personal-bg: #f0eefc; --personal-text: #3a2a7a; --personal-border: #cfc9f5;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'DM Sans', sans-serif; background: var(--paper); color: var(--ink); min-height: 100vh; }
.header { padding: 1.5rem 2rem 1rem; border-bottom: 1px solid var(--rule); display: flex; align-items: flex-end; justify-content: space-between; flex-wrap: wrap; gap: 1rem; background: #fff; }
.header-left h1 { font-family: 'DM Serif Display', serif; font-size: 28px; color: var(--ink); line-height: 1.1; }
.header-left p { font-size: 13px; color: var(--ink-3); margin-top: 3px; font-weight: 300; }
.stats { display: flex; gap: 1.5rem; flex-wrap: wrap; }
.stat { text-align: right; }
.stat-num { font-family: 'DM Serif Display', serif; font-size: 22px; color: var(--ink); line-height: 1; }
.stat-label { font-size: 11px; color: var(--ink-3); margin-top: 2px; text-transform: uppercase; letter-spacing: 0.06em; }
.sync-bar { display: flex; align-items: center; justify-content: space-between; padding: 6px 2rem; background: var(--paper-2); border-bottom: 1px solid var(--rule); font-size: 12px; color: var(--ink-3); }
.sync-btn { font-family: 'DM Sans', sans-serif; font-size: 12px; background: none; border: 1px solid var(--rule); border-radius: 6px; padding: 3px 12px; cursor: pointer; color: var(--ink-3); transition: all 0.15s; }
.sync-btn:hover { background: var(--paper-3); color: var(--ink); }
.sync-btn:disabled { opacity: 0.4; cursor: not-allowed; }
.nav { display: flex; padding: 0 2rem; border-bottom: 1px solid var(--rule); background: #fff; overflow-x: auto; }
.nav-btn { font-family: 'DM Sans', sans-serif; font-size: 13px; color: var(--ink-3); background: none; border: none; border-bottom: 2px solid transparent; padding: 12px 16px; cursor: pointer; white-space: nowrap; transition: all 0.15s; }
.nav-btn:hover { color: var(--ink); }
.nav-btn.active { color: var(--ink); border-bottom-color: var(--accent); font-weight: 500; }
.content { padding: 1.5rem 2rem; max-width: 900px; }
.section-rule { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-3); font-weight: 500; margin: 1.5rem 0 10px; padding-bottom: 6px; border-bottom: 1px solid var(--rule); display: flex; align-items: center; justify-content: space-between; }
.section-rule:first-child { margin-top: 0; }
.section-count { background: var(--paper-2); border-radius: 20px; padding: 1px 8px; font-size: 11px; color: var(--ink-3); letter-spacing: 0; text-transform: none; }
.task-card { background: #fff; border: 1px solid var(--rule); border-radius: 8px; padding: 10px 14px; margin-bottom: 6px; display: flex; align-items: flex-start; gap: 10px; cursor: pointer; transition: border-color 0.15s, opacity 0.2s; }
.task-card:hover { border-color: #bbb; }
.task-card.done { opacity: 0.38; }
.task-card.done .task-title { text-decoration: line-through; }
.task-card.saving { opacity: 0.6; cursor: wait; }
.checkbox { width: 17px; height: 17px; border: 1.5px solid var(--rule); border-radius: 4px; flex-shrink: 0; margin-top: 2px; display: flex; align-items: center; justify-content: center; transition: all 0.15s; }
.task-card.done .checkbox { background: var(--accent); border-color: var(--accent); }
.task-card.done .checkbox::after { content: ''; display: block; width: 8px; height: 5px; border-left: 2px solid #fff; border-bottom: 2px solid #fff; transform: rotate(-45deg) translateY(-1px); }
.task-body { flex: 1; min-width: 0; }
.task-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.task-title { font-size: 14px; color: var(--ink); line-height: 1.4; flex: 1; }
.badges { display: flex; gap: 4px; flex-wrap: wrap; flex-shrink: 0; }
.badge { font-size: 11px; padding: 2px 8px; border-radius: 20px; white-space: nowrap; font-weight: 400; }
.badge-date { background: var(--paper-2); color: var(--ink-3); border: 1px solid var(--rule); }
.badge-urgent { background: var(--urgent-bg); color: var(--urgent-text); border: 1px solid var(--urgent-border); }
.badge-work { background: var(--work-bg); color: var(--work-text); border: 1px solid var(--work-border); }
.badge-personal { background: var(--personal-bg); color: var(--personal-text); border: 1px solid var(--personal-border); }
.task-note { font-size: 12px; color: var(--ink-3); margin-top: 3px; line-height: 1.4; font-weight: 300; }
.empty { font-size: 13px; color: var(--ink-3); padding: 1rem 0; text-align: center; font-style: italic; }
.project-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 1rem; }
.project-card { background: #fff; border: 1px solid var(--rule); border-radius: 12px; overflow: hidden; cursor: pointer; transition: box-shadow 0.15s, transform 0.15s; }
.project-card:hover { box-shadow: 0 4px 16px rgba(0,0,0,0.07); transform: translateY(-1px); }
.project-card-header { padding: 14px 16px 10px; border-bottom: 1px solid var(--rule); display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
.project-name { font-family: 'DM Serif Display', serif; font-size: 16px; color: var(--ink); line-height: 1.3; }
.project-date { font-size: 11px; color: var(--ink-3); margin-top: 2px; }
.project-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; margin-top: 4px; }
.project-tasks-preview { padding: 10px 16px 14px; }
.project-task-row { display: flex; align-items: flex-start; gap: 7px; padding: 3px 0; font-size: 12px; color: var(--ink-2); line-height: 1.35; }
.mini-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--rule); flex-shrink: 0; margin-top: 5px; }
.mini-dot.urgent { background: #d4522a; }
.project-more { font-size: 11px; color: var(--ink-3); margin-top: 6px; padding-top: 6px; border-top: 1px solid var(--paper-2); }
.project-progress { display: flex; align-items: center; gap: 8px; padding: 8px 16px; background: var(--paper-2); font-size: 11px; color: var(--ink-3); }
.progress-bar { flex: 1; height: 3px; background: var(--rule); border-radius: 2px; overflow: hidden; }
.progress-fill { height: 100%; background: var(--accent); border-radius: 2px; }
.back-btn { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--ink-3); background: none; border: none; cursor: pointer; padding: 0; margin-bottom: 1.25rem; font-family: 'DM Sans', sans-serif; }
.back-btn:hover { color: var(--ink); }
.detail-title { font-family: 'DM Serif Display', serif; font-size: 24px; color: var(--ink); }
.detail-meta { font-size: 13px; color: var(--ink-3); margin-top: 4px; margin-bottom: 1.25rem; }
.priority-section { margin-bottom: 1.75rem; }
.priority-header { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; padding: 8px 12px; border-radius: 8px; font-size: 12px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.06em; }
.ph-urgent { background: var(--urgent-bg); color: var(--urgent-text); }
.ph-soon { background: var(--work-bg); color: var(--work-text); }
.ph-later { background: var(--paper-2); color: var(--ink-3); }
.pill-count { background: rgba(0,0,0,0.08); border-radius: 20px; padding: 1px 7px; font-size: 11px; }
.spinner { display: inline-block; width: 10px; height: 10px; border: 1.5px solid var(--rule); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.7s linear infinite; vertical-align: middle; margin-right: 5px; }
@keyframes spin { to { transform: rotate(360deg); } }
.error-box { background: var(--urgent-bg); border: 1px solid var(--urgent-border); border-radius: 8px; padding: 1rem 1.25rem; font-size: 13px; color: var(--urgent-text); margin-bottom: 1rem; }
@media (max-width: 600px) {
  .header { padding: 1.25rem 1rem 0.75rem; }
  .sync-bar, .nav { padding-left: 1rem; padding-right: 1rem; }
  .content { padding: 1rem; }
  .project-grid { grid-template-columns: 1fr; }
  .stats { gap: 1rem; }
}
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <h1>Command Center</h1>
    <p>Your life, organized.</p>
  </div>
  <div class="stats">
    <div class="stat"><div class="stat-num" id="stat-urgent">—</div><div class="stat-label">Urgent</div></div>
    <div class="stat"><div class="stat-num" id="stat-total">—</div><div class="stat-label">Open</div></div>
    <div class="stat"><div class="stat-num" id="stat-done">—</div><div class="stat-label">Done</div></div>
  </div>
</div>

<div class="sync-bar">
  <span id="sync-status"><span class="spinner"></span>Loading tasks from Google Sheets...</span>
  <button class="sync-btn" id="refresh-btn" onclick="loadTasks()" disabled>↻ Refresh</button>
</div>

<div class="nav">
  <button class="nav-btn active" onclick="setView('schedule',this)">Schedule</button>
  <button class="nav-btn" onclick="setView('projects',this)">Projects</button>
  <button class="nav-btn" onclick="setView('priority',this)">Priority</button>
  <button class="nav-btn" onclick="setView('completed',this)">Completed</button>
</div>

<div class="content">
  <div id="view-schedule"></div>
  <div id="view-projects" style="display:none"></div>
  <div id="view-priority" style="display:none"></div>
  <div id="view-completed" style="display:none"></div>
</div>

<script>
const SHEET_ID = '1ocgHi67GLlyhjTasseKECGDnLDS8Xqi0VFaKhURIMeU';
const PROXY_URL = `https://api.allorigins.win/raw?url=${encodeURIComponent(`https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv`)}`;

const PROJECTS = [
  {id:'pittsburgh',name:'Pittsburgh / Resilient Together',date:'Debrief & wrap-up',color:'#d4522a'},
  {id:'housing',name:'Housing Innovation Summit',date:'May 20–22 · Charlotte',color:'#185FA5'},
  {id:'boston',name:'Boston / June 1 Retreat',date:'May 30 – June 4',color:'#3B6D11'},
  {id:'paris',name:'Paris Trip',date:'June 6–11',color:'#854F0B'},
  {id:'photos',name:'Family Pictures',date:'Saturday, May 23',color:'#993556'},
  {id:'kids',name:'Kids & Family',date:'Ongoing',color:'#533AB7'},
  {id:'admin',name:'Personal Admin',date:'Ongoing',color:'#48535b'},
  {id:'chicago',name:'Chicago Trip',date:'June 15–18',color:'#0F6E56'},
  {id:'cruise',name:'Miami Cruise',date:'Late July',color:'#0771A6'},
];

let TASKS = [];
let currentView = 'schedule';
let currentProject = null;
let saving = new Set();

function setSyncStatus(msg, spinning) {
  document.getElementById('sync-status').innerHTML = (spinning ? '<span class="spinner"></span>' : '') + msg;
}

function parseCSV(text) {
  const lines = text.trim().split('\n');
  const headers = lines[0].split(',').map(h => h.replace(/"/g,'').trim());
  return lines.slice(1).map(line => {
    const vals = [];
    let cur = '', inQ = false;
    for (let i = 0; i < line.length; i++) {
      const c = line[i];
      if (c === '"') { inQ = !inQ; }
      else if (c === ',' && !inQ) { vals.push(cur); cur = ''; }
      else cur += c;
    }
    vals.push(cur);
    const obj = {};
    headers.forEach((h, i) => obj[h] = (vals[i] || '').trim());
    obj.id = parseInt(obj.id);
    obj.done = obj.done === 'TRUE';
    return obj;
  }).filter(t => !isNaN(t.id) && t.id > 0);
}

async function loadTasks() {
  const btn = document.getElementById('refresh-btn');
  btn.disabled = true;
  setSyncStatus('Syncing with Google Sheets...', true);
  try {
    const res = await fetch(PROXY_URL);
    if (!res.ok) throw new Error('fetch failed');
    const text = await res.text();
    TASKS = parseCSV(text);
    const t = new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
    setSyncStatus(`Synced from Google Sheets · ${t}`, false);
    updateStats();
    renderCurrentView();
  } catch(e) {
    setSyncStatus('Could not load — check your internet connection', false);
    document.getElementById('view-' + currentView).innerHTML = '<div class="error-box">Unable to load tasks. Make sure the Google Sheet is shared publicly (File → Share → Anyone with the link can view), then refresh.</div>';
  }
  btn.disabled = false;
}

async function toggleTask(id) {
  if (saving.has(id)) return;
  const task = TASKS.find(t => t.id === id);
  if (!task) return;
  const newDone = !task.done;
  task.done = newDone;
  saving.add(id);
  updateStats();
  renderCurrentView();

  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 200,
        system: `You manage a Google Sheet (ID: ${SHEET_ID}) with task data. When asked to update a done status, use the Google Drive MCP to find the row with the matching id and set the done column to TRUE or FALSE. Reply only with "done".`,
        messages: [{role:'user', content:`Set done=${newDone ? 'TRUE' : 'FALSE'} for task id ${id}`}],
        mcp_servers: [{type:'url', url:'https://drivemcp.googleapis.com/mcp/v1', name:'google-drive'}]
      })
    });
    if (!res.ok) throw new Error('API error');
  } catch(e) {
    task.done = !newDone;
    updateStats();
  }
  saving.delete(id);
  renderCurrentView();
}

function updateStats() {
  const open = TASKS.filter(t => !t.done);
  document.getElementById('stat-urgent').textContent = open.filter(t => t.urgency === 'urgent').length;
  document.getElementById('stat-total').textContent = open.length;
  document.getElementById('stat-done').textContent = TASKS.filter(t => t.done).length;
}

function taskCard(t) {
  const isSaving = saving.has(t.id);
  const urg = t.urgency === 'urgent' ? '<span class="badge badge-urgent">urgent</span>' : '';
  const cat = t.cat === 'work' ? '<span class="badge badge-work">work</span>' : '<span class="badge badge-personal">personal</span>';
  const dt = t.date ? `<span class="badge badge-date">${t.date}</span>` : '';
  return `<div class="task-card${t.done?' done':''}${isSaving?' saving':''}" onclick="toggleTask(${t.id})">
    <div class="checkbox">${isSaving ? '<span class="spinner" style="width:8px;height:8px;margin:0"></span>' : ''}</div>
    <div class="task-body">
      <div class="task-top"><span class="task-title">${t.title}</span><div class="badges">${urg}${cat}${dt}</div></div>
      ${t.note ? `<div class="task-note">${t.note}</div>` : ''}
    </div>
  </div>`;
}

function sectionRule(label, count) {
  return `<div class="section-rule">${label}<span class="section-count">${count}</span></div>`;
}

const SCHED_GROUPS = [
  {label:'This weekend — needs attention now', filter: t => t.urgency==='urgent'},
  {label:'Next up — week of May 19', filter: t => t.urgency==='soon' && (t.date||'').match(/20|21|22|23|Before Tue|Overdue|This week|ASAP|Follow-up/)},
  {label:'End of May', filter: t => t.urgency==='soon' && (t.date||'').match(/5\/30|May 30|Before Sat 5\/30|Before June 1/)},
  {label:'June 1–11 · Boston + Paris', filter: t => t.urgency==='soon' && (t.date||'').match(/June 1|June 6|~June 1|~June 6/)},
  {label:'June 12–18 · Home + Chicago', filter: t => t.urgency==='later' && (t.date||'').match(/June 12|June 15|June 16/)},
  {label:'June 19+ · Wrapping up', filter: t => t.urgency==='later' && (t.date||'').match(/June 19|Father/)},
  {label:'Late July · Cruise', filter: t => t.project==='cruise'},
];

function renderSchedule() {
  const open = TASKS.filter(t => !t.done);
  let html = '', assigned = new Set();
  SCHED_GROUPS.forEach(g => {
    const items = open.filter(t => g.filter(t) && !assigned.has(t.id));
    items.forEach(t => assigned.add(t.id));
    if (!items.length) return;
    html += sectionRule(g.label, items.length);
    items.forEach(t => html += taskCard(t));
  });
  const rest = open.filter(t => !assigned.has(t.id));
  if (rest.length) { html += sectionRule('Other', rest.length); rest.forEach(t => html += taskCard(t)); }
  if (!html) html = '<p class="empty">Everything\'s done. Enjoy the moment.</p>';
  document.getElementById('view-schedule').innerHTML = html;
}

function renderProjects() {
  if (currentProject) { renderProjectDetail(currentProject); return; }
  let html = '<div class="project-grid">';
  PROJECTS.forEach(p => {
    const all = TASKS.filter(t => t.project === p.id);
    const open = all.filter(t => !t.done);
    const doneT = all.filter(t => t.done);
    const pct = all.length ? Math.round(doneT.length / all.length * 100) : 0;
    const preview = open.slice(0, 3);
    const more = open.length - preview.length;
    html += `<div class="project-card" onclick="openProject('${p.id}')">
      <div class="project-card-header">
        <div><div class="project-name">${p.name}</div><div class="project-date">${p.date}</div></div>
        <div class="project-dot" style="background:${p.color}"></div>
      </div>
      <div class="project-tasks-preview">
        ${preview.map(t=>`<div class="project-task-row"><div class="mini-dot${t.urgency==='urgent'?' urgent':''}"></div>${t.title}</div>`).join('')}
        ${more>0?`<div class="project-more">+${more} more tasks</div>`:''}
        ${open.length===0?`<div class="project-more" style="color:#1a5c1a">All done ✓</div>`:''}
      </div>
      <div class="project-progress">
        <span>${pct}% done</span>
        <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
        <span>${open.length} left</span>
      </div>
    </div>`;
  });
  html += '</div>';
  document.getElementById('view-projects').innerHTML = html;
}

function openProject(id) { currentProject = id; renderProjectDetail(id); }

function renderProjectDetail(id) {
  const p = PROJECTS.find(x => x.id === id);
  const all = TASKS.filter(t => t.project === id);
  const open = all.filter(t => !t.done);
  const doneT = all.filter(t => t.done);
  const urgent = open.filter(t => t.urgency === 'urgent');
  const soon = open.filter(t => t.urgency === 'soon');
  const later = open.filter(t => t.urgency === 'later');
  let html = `<button class="back-btn" onclick="closeProject()">← All projects</button>
  <div class="detail-title">${p.name}</div>
  <div class="detail-meta">${p.date} · ${open.length} open · ${doneT.length} done</div>`;
  if (urgent.length) { html += sectionRule('Urgent', urgent.length); urgent.forEach(t => html += taskCard(t)); }
  if (soon.length) { html += sectionRule('Coming up', soon.length); soon.forEach(t => html += taskCard(t)); }
  if (later.length) { html += sectionRule('Later', later.length); later.forEach(t => html += taskCard(t)); }
  if (doneT.length) { html += sectionRule('Done', doneT.length); doneT.forEach(t => html += taskCard(t)); }
  if (!all.length) html += '<p class="empty">No tasks yet.</p>';
  document.getElementById('view-projects').innerHTML = html;
}

function closeProject() { currentProject = null; renderProjects(); }

function renderPriority() {
  const open = TASKS.filter(t => !t.done);
  const urgent = open.filter(t => t.urgency === 'urgent');
  const soon = open.filter(t => t.urgency === 'soon');
  const later = open.filter(t => t.urgency === 'later');
  let html = '';
  if (urgent.length) { html+=`<div class="priority-section"><div class="priority-header ph-urgent">This weekend <span class="pill-count">${urgent.length}</span></div>`; urgent.forEach(t=>html+=taskCard(t)); html+='</div>'; }
  if (soon.length) { html+=`<div class="priority-section"><div class="priority-header ph-soon">Coming up <span class="pill-count">${soon.length}</span></div>`; soon.forEach(t=>html+=taskCard(t)); html+='</div>'; }
  if (later.length) { html+=`<div class="priority-section"><div class="priority-header ph-later">Later <span class="pill-count">${later.length}</span></div>`; later.forEach(t=>html+=taskCard(t)); html+='</div>'; }
  if (!html) html = '<p class="empty">Nothing open right now.</p>';
  document.getElementById('view-priority').innerHTML = html;
}

function renderCompleted() {
  const doneItems = TASKS.filter(t => t.done);
  let html = '';
  if (!doneItems.length) html = '<p class="empty">Nothing checked off yet — go get something done.</p>';
  else { html += sectionRule('Completed', doneItems.length); doneItems.forEach(t => html += taskCard(t)); }
  document.getElementById('view-completed').innerHTML = html;
}

function setView(view, btn) {
  currentView = view; currentProject = null;
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  ['schedule','projects','priority','completed'].forEach(v => {
    document.getElementById('view-' + v).style.display = v === view ? 'block' : 'none';
  });
  renderCurrentView();
}

function renderCurrentView() {
  if (currentView === 'schedule') renderSchedule();
  else if (currentView === 'projects') renderProjects();
  else if (currentView === 'priority') renderPriority();
  else if (currentView === 'completed') renderCompleted();
}

loadTasks();
</script>
</body>
</html>
