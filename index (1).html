<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Command Center</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --cream: #faf6f0;
  --cream-2: #f3ede3;
  --cream-3: #e8dfd2;
  --ink: #2c2118;
  --ink-2: #5c4e3f;
  --ink-3: #9e8e7e;
  --rule: #ddd4c4;
  --terra: #b85c38;
  --terra-light: #f5e8e2;
  --terra-border: #e8c4b4;
  --amber: #c47d2a;
  --amber-light: #faf0dc;
  --amber-border: #e8d4a4;
  --rose: #a85870;
  --rose-light: #f7edf0;
  --rose-border: #e8c4cc;
  --sage: #5a7a5a;
  --sage-light: #ecf3ec;
  --sage-border: #c4d8c4;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Jost', sans-serif; background: var(--cream); color: var(--ink); min-height: 100vh; }

/* HEADER */
.header {
  padding: 2rem 2rem 1.25rem;
  background: var(--ink);
  display: flex; align-items: flex-end; justify-content: space-between; flex-wrap: wrap; gap: 1rem;
}
.header-left h1 {
  font-family: 'Playfair Display', serif;
  font-size: 30px; font-weight: 400;
  color: var(--cream); line-height: 1.1; letter-spacing: 0.01em;
}
.header-left p { font-size: 12px; color: var(--ink-3); margin-top: 4px; font-weight: 300; letter-spacing: 0.08em; text-transform: uppercase; }
.stats { display: flex; gap: 2rem; flex-wrap: wrap; }
.stat { text-align: right; }
.stat-num { font-family: 'Playfair Display', serif; font-size: 26px; color: var(--cream); line-height: 1; }
.stat-label { font-size: 10px; color: var(--ink-3); margin-top: 3px; text-transform: uppercase; letter-spacing: 0.1em; }

/* SYNC BAR */
.sync-bar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 6px 2rem; background: var(--cream-2); border-bottom: 1px solid var(--rule);
  font-size: 11px; color: var(--ink-3); letter-spacing: 0.03em;
}
.sync-btn {
  font-family: 'Jost', sans-serif; font-size: 11px; background: none;
  border: 1px solid var(--rule); border-radius: 4px; padding: 3px 12px;
  cursor: pointer; color: var(--ink-3); transition: all 0.15s; letter-spacing: 0.04em;
}
.sync-btn:hover { background: var(--cream-3); color: var(--ink); border-color: var(--ink-3); }
.sync-btn:disabled { opacity: 0.4; cursor: not-allowed; }

/* NAV */
.nav {
  display: flex; padding: 0 2rem;
  border-bottom: 1px solid var(--rule);
  background: var(--cream-2); overflow-x: auto;
}
.nav-btn {
  font-family: 'Jost', sans-serif; font-size: 12px; color: var(--ink-3);
  background: none; border: none; border-bottom: 2px solid transparent;
  padding: 13px 16px; cursor: pointer; white-space: nowrap;
  transition: all 0.15s; letter-spacing: 0.06em; text-transform: uppercase;
}
.nav-btn:hover { color: var(--ink); }
.nav-btn.active { color: var(--terra); border-bottom-color: var(--terra); font-weight: 500; }

/* CONTENT */
.content { padding: 1.75rem 2rem; max-width: 860px; }

/* SECTION RULES */
.section-rule {
  font-size: 10px; text-transform: uppercase; letter-spacing: 0.12em;
  color: var(--ink-3); font-weight: 500;
  margin: 1.75rem 0 10px; padding-bottom: 7px;
  border-bottom: 1px solid var(--rule);
  display: flex; align-items: center; justify-content: space-between;
}
.section-rule:first-child { margin-top: 0; }
.section-count {
  background: var(--cream-3); border-radius: 20px;
  padding: 1px 8px; font-size: 10px; color: var(--ink-3);
  letter-spacing: 0; text-transform: none;
}

/* TASK CARDS */
.task-card {
  background: #fff; border: 1px solid var(--rule);
  border-radius: 6px; padding: 11px 14px;
  margin-bottom: 6px; display: flex; align-items: flex-start;
  gap: 11px; transition: border-color 0.15s, opacity 0.2s, box-shadow 0.15s;
}
.task-card:hover { border-color: var(--ink-3); box-shadow: 0 2px 8px rgba(44,33,24,0.06); }
.task-card.done { opacity: 0.35; }
.task-card.done .task-title { text-decoration: line-through; }
.task-card.saving { opacity: 0.6; }

/* CHECKBOX */
.checkbox {
  width: 18px; height: 18px; border: 1.5px solid var(--cream-3);
  border-radius: 3px; flex-shrink: 0; margin-top: 1px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; transition: all 0.15s; background: var(--cream);
}
.task-card:hover .checkbox { border-color: var(--terra); }
.task-card.done .checkbox { background: var(--terra); border-color: var(--terra); }
.task-card.done .checkbox::after {
  content: ''; display: block; width: 8px; height: 5px;
  border-left: 2px solid #fff; border-bottom: 2px solid #fff;
  transform: rotate(-45deg) translateY(-1px);
}

.task-body { flex: 1; min-width: 0; }
.task-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.task-title { font-size: 14px; color: var(--ink); line-height: 1.45; flex: 1; font-weight: 400; }
.badges { display: flex; gap: 4px; flex-wrap: wrap; flex-shrink: 0; }
.badge { font-size: 10px; padding: 2px 8px; border-radius: 3px; white-space: nowrap; font-weight: 400; letter-spacing: 0.04em; text-transform: uppercase; }
.badge-date { background: var(--cream-2); color: var(--ink-3); border: 1px solid var(--rule); }
.badge-urgent { background: var(--terra-light); color: var(--terra); border: 1px solid var(--terra-border); }
.badge-work { background: var(--amber-light); color: var(--amber); border: 1px solid var(--amber-border); }
.badge-personal { background: var(--rose-light); color: var(--rose); border: 1px solid var(--rose-border); }
.task-note { font-size: 12px; color: var(--ink-3); margin-top: 4px; line-height: 1.5; font-weight: 300; font-style: italic; }

/* EMPTY */
.empty { font-size: 13px; color: var(--ink-3); padding: 1.5rem 0; text-align: center; font-style: italic; font-family: 'Playfair Display', serif; }

/* PROJECT GRID */
.project-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 1rem; }
.project-card {
  background: #fff; border: 1px solid var(--rule);
  border-radius: 8px; overflow: hidden; cursor: pointer;
  transition: box-shadow 0.15s, transform 0.15s;
}
.project-card:hover { box-shadow: 0 4px 18px rgba(44,33,24,0.1); transform: translateY(-1px); }
.project-card-header {
  padding: 14px 16px 10px; border-bottom: 1px solid var(--rule);
  display: flex; align-items: flex-start; justify-content: space-between; gap: 8px;
}
.project-name { font-family: 'Playfair Display', serif; font-size: 15px; color: var(--ink); line-height: 1.3; font-weight: 400; }
.project-date { font-size: 11px; color: var(--ink-3); margin-top: 3px; letter-spacing: 0.02em; }
.project-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; margin-top: 4px; }
.project-tasks-preview { padding: 10px 16px 12px; }
.project-task-row { display: flex; align-items: flex-start; gap: 7px; padding: 3px 0; font-size: 11px; color: var(--ink-2); line-height: 1.4; }
.mini-dot { width: 4px; height: 4px; border-radius: 50%; background: var(--rule); flex-shrink: 0; margin-top: 5px; }
.mini-dot.urgent { background: var(--terra); }
.project-more { font-size: 11px; color: var(--ink-3); margin-top: 6px; padding-top: 6px; border-top: 1px solid var(--cream-2); letter-spacing: 0.02em; }
.project-progress {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 16px; background: var(--cream-2);
  font-size: 11px; color: var(--ink-3);
}
.progress-bar { flex: 1; height: 2px; background: var(--rule); border-radius: 2px; overflow: hidden; }
.progress-fill { height: 100%; background: var(--terra); border-radius: 2px; transition: width 0.3s; }

/* PROJECT DETAIL */
.back-btn {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 12px; color: var(--ink-3); background: none; border: none;
  cursor: pointer; padding: 0; margin-bottom: 1.25rem;
  font-family: 'Jost', sans-serif; letter-spacing: 0.04em; text-transform: uppercase;
}
.back-btn:hover { color: var(--terra); }
.detail-title { font-family: 'Playfair Display', serif; font-size: 26px; color: var(--ink); font-weight: 400; }
.detail-meta { font-size: 12px; color: var(--ink-3); margin-top: 4px; margin-bottom: 1.25rem; letter-spacing: 0.02em; }

/* PRIORITY VIEW */
.priority-section { margin-bottom: 1.75rem; }
.priority-header {
  display: flex; align-items: center; gap: 8px; margin-bottom: 10px;
  padding: 8px 12px; border-radius: 5px;
  font-size: 10px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.1em;
}
.ph-urgent { background: var(--terra-light); color: var(--terra); border-left: 3px solid var(--terra); }
.ph-soon { background: var(--amber-light); color: var(--amber); border-left: 3px solid var(--amber); }
.ph-later { background: var(--cream-2); color: var(--ink-3); border-left: 3px solid var(--rule); }
.pill-count { background: rgba(0,0,0,0.08); border-radius: 20px; padding: 1px 7px; font-size: 10px; }

/* SPINNER */
.spinner {
  display: inline-block; width: 10px; height: 10px;
  border: 1.5px solid var(--rule); border-top-color: var(--terra);
  border-radius: 50%; animation: spin 0.7s linear infinite;
  vertical-align: middle; margin-right: 5px;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ERROR */
.error-box {
  background: var(--terra-light); border: 1px solid var(--terra-border);
  border-radius: 6px; padding: 1rem 1.25rem;
  font-size: 13px; color: var(--terra); margin-bottom: 1rem;
}

@media (max-width: 600px) {
  .header { padding: 1.25rem 1rem 1rem; }
  .sync-bar, .nav { padding-left: 1rem; padding-right: 1rem; }
  .content { padding: 1.25rem 1rem; }
  .project-grid { grid-template-columns: 1fr; }
  .stats { gap: 1.25rem; }
  .header-left h1 { font-size: 24px; }
}
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <h1>Command Center</h1>
    <p>Your life, organized</p>
  </div>
  <div class="stats">
    <div class="stat"><div class="stat-num" id="stat-urgent">—</div><div class="stat-label">Urgent</div></div>
    <div class="stat"><div class="stat-num" id="stat-total">—</div><div class="stat-label">Open</div></div>
    <div class="stat"><div class="stat-num" id="stat-done">—</div><div class="stat-label">Done</div></div>
  </div>
</div>

<div class="sync-bar">
  <span id="sync-status"><span class="spinner"></span>Loading tasks...</span>
  <button class="sync-btn" id="refresh-btn" onclick="loadTasks()" disabled>↻ Refresh</button>
</div>

<div class="nav">
  <button class="nav-btn active" onclick="setView('schedule',this)">Schedule</button>
  <button class="nav-btn" onclick="setView('projects',this)">Projects</button>
  <button class="nav-btn" onclick="setView('priority',this)">Priority</button>
  <button class="nav-btn" onclick="setView('completed',this)">Completed</button>
</div>

<div class="content">
  <div id="view-schedule"></div>
  <div id="view-projects" style="display:none"></div>
  <div id="view-priority" style="display:none"></div>
  <div id="view-completed" style="display:none"></div>
</div>

<script>
const SHEET_ID = '1ocgHi67GLlyhjTasseKECGDnLDS8Xqi0VFaKhURIMeU';
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyRFF218h__mUY7v2neIz76QDxx3lTMG3GWWuiJn0We3K845DTsC4YKAv-GRLFcsmdj/exec';
const CSV_URL = `https://api.allorigins.win/raw?url=${encodeURIComponent(`https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv`)}`;

const PROJECTS = [
  {id:'pittsburgh',name:'Pittsburgh / Resilient Together',date:'Debrief & wrap-up',color:'#b85c38'},
  {id:'housing',name:'Housing Innovation Summit',date:'May 20–22 · Charlotte',color:'#2a5c8a'},
  {id:'boston',name:'Boston / June 1 Retreat',date:'May 30 – June 4',color:'#4a7a3a'},
  {id:'paris',name:'Paris Trip',date:'June 6–11',color:'#c47d2a'},
  {id:'photos',name:'Family Pictures',date:'Saturday, May 23',color:'#a85870'},
  {id:'kids',name:'Kids & Family',date:'Ongoing',color:'#7a5ab8'},
  {id:'admin',name:'Personal Admin',date:'Ongoing',color:'#5a6a5a'},
  {id:'chicago',name:'Chicago Trip',date:'June 15–18',color:'#2a7a5a'},
  {id:'cruise',name:'Miami Cruise',date:'Late July',color:'#2a6a8a'},
];

let TASKS = [];
let currentView = 'schedule';
let currentProject = null;
let saving = new Set();

function setSyncStatus(msg, spinning) {
  document.getElementById('sync-status').innerHTML = (spinning ? '<span class="spinner"></span>' : '') + msg;
}

function parseCSV(text) {
  const lines = text.trim().split('\n');
  const headers = lines[0].split(',').map(h => h.replace(/"/g,'').trim());
  return lines.slice(1).map(line => {
    const vals = []; let cur = '', inQ = false;
    for (let i = 0; i < line.length; i++) {
      const c = line[i];
      if (c === '"') { inQ = !inQ; }
      else if (c === ',' && !inQ) { vals.push(cur); cur = ''; }
      else cur += c;
    }
    vals.push(cur);
    const obj = {};
    headers.forEach((h, i) => obj[h] = (vals[i] || '').trim());
    obj.id = parseInt(obj.id);
    obj.done = obj.done === 'TRUE';
    return obj;
  }).filter(t => !isNaN(t.id) && t.id > 0);
}

async function loadTasks() {
  const btn = document.getElementById('refresh-btn');
  btn.disabled = true;
  setSyncStatus('Syncing...', true);
  try {
    const res = await fetch(CSV_URL);
    if (!res.ok) throw new Error('fetch failed');
    const text = await res.text();
    TASKS = parseCSV(text);
    const t = new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
    setSyncStatus(`Synced · ${t}`, false);
    updateStats();
    renderCurrentView();
  } catch(e) {
    setSyncStatus('Could not load — try refreshing', false);
    document.getElementById('view-' + currentView).innerHTML = '<div class="error-box">Unable to load tasks. Make sure the Google Sheet is shared publicly, then refresh.</div>';
  }
  btn.disabled = false;
}

async function toggleTask(id) {
  if (saving.has(id)) return;
  const task = TASKS.find(t => t.id === id);
  if (!task) return;
  const newDone = !task.done;
  task.done = newDone;
  saving.add(id);
  updateStats();
  renderCurrentView();
  try {
    await fetch(SCRIPT_URL, {
      method: 'POST',
      body: JSON.stringify({id, done: newDone}),
    });
  } catch(e) {
    task.done = !newDone;
    updateStats();
  }
  saving.delete(id);
  renderCurrentView();
}

function updateStats() {
  const open = TASKS.filter(t => !t.done);
  document.getElementById('stat-urgent').textContent = open.filter(t => t.urgency === 'urgent').length;
  document.getElementById('stat-total').textContent = open.length;
  document.getElementById('stat-done').textContent = TASKS.filter(t => t.done).length;
}

function taskCard(t) {
  const isSaving = saving.has(t.id);
  const urg = t.urgency === 'urgent' ? '<span class="badge badge-urgent">urgent</span>' : '';
  const cat = t.cat === 'work' ? '<span class="badge badge-work">work</span>' : '<span class="badge badge-personal">personal</span>';
  const dt = t.date ? `<span class="badge badge-date">${t.date}</span>` : '';
  return `<div class="task-card${t.done?' done':''}${isSaving?' saving':''}" onclick="toggleTask(${t.id})">
    <div class="checkbox">${isSaving ? '<span class="spinner" style="width:8px;height:8px;margin:0;border-width:1.5px"></span>' : ''}</div>
    <div class="task-body">
      <div class="task-top"><span class="task-title">${t.title}</span><div class="badges">${urg}${cat}${dt}</div></div>
      ${t.note ? `<div class="task-note">${t.note}</div>` : ''}
    </div>
  </div>`;
}

function sectionRule(label, count) {
  return `<div class="section-rule">${label}<span class="section-count">${count}</span></div>`;
}

const SCHED_GROUPS = [
  {label:'This weekend — needs attention now', filter: t => t.urgency==='urgent'},
  {label:'Next up — week of May 19', filter: t => t.urgency==='soon' && (t.date||'').match(/20|21|22|23|Before Tue|Overdue|This week|ASAP|Follow-up/)},
  {label:'End of May', filter: t => t.urgency==='soon' && (t.date||'').match(/5\/30|May 30|Before Sat 5\/30|Before June 1/)},
  {label:'June 1–11 · Boston + Paris', filter: t => t.urgency==='soon' && (t.date||'').match(/June 1|June 6|~June 1|~June 6/)},
  {label:'June 12–18 · Home + Chicago', filter: t => t.urgency==='later' && (t.date||'').match(/June 12|June 15|June 16/)},
  {label:'June 19+ · Wrapping up', filter: t => t.urgency==='later' && (t.date||'').match(/June 19|Father/)},
  {label:'Late July · Cruise', filter: t => t.project==='cruise'},
];

function renderSchedule() {
  const open = TASKS.filter(t => !t.done);
  let html = '', assigned = new Set();
  SCHED_GROUPS.forEach(g => {
    const items = open.filter(t => g.filter(t) && !assigned.has(t.id));
    items.forEach(t => assigned.add(t.id));
    if (!items.length) return;
    html += sectionRule(g.label, items.length);
    items.forEach(t => html += taskCard(t));
  });
  const rest = open.filter(t => !assigned.has(t.id));
  if (rest.length) { html += sectionRule('Other', rest.length); rest.forEach(t => html += taskCard(t)); }
  if (!html) html = '<p class="empty">Everything\'s done. Enjoy the moment.</p>';
  document.getElementById('view-schedule').innerHTML = html;
}

function renderProjects() {
  if (currentProject) { renderProjectDetail(currentProject); return; }
  let html = '<div class="project-grid">';
  PROJECTS.forEach(p => {
    const all = TASKS.filter(t => t.project === p.id);
    const open = all.filter(t => !t.done);
    const doneT = all.filter(t => t.done);
    const pct = all.length ? Math.round(doneT.length / all.length * 100) : 0;
    const preview = open.slice(0, 3);
    const more = open.length - preview.length;
    html += `<div class="project-card" onclick="openProject('${p.id}')">
      <div class="project-card-header">
        <div><div class="project-name">${p.name}</div><div class="project-date">${p.date}</div></div>
        <div class="project-dot" style="background:${p.color}"></div>
      </div>
      <div class="project-tasks-preview">
        ${preview.map(t=>`<div class="project-task-row"><div class="mini-dot${t.urgency==='urgent'?' urgent':''}"></div>${t.title}</div>`).join('')}
        ${more>0?`<div class="project-more">+${more} more tasks</div>`:''}
        ${open.length===0?`<div class="project-more" style="color:var(--sage)">All done ✓</div>`:''}
      </div>
      <div class="project-progress">
        <span>${pct}%</span>
        <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
        <span>${open.length} left</span>
      </div>
    </div>`;
  });
  html += '</div>';
  document.getElementById('view-projects').innerHTML = html;
}

function openProject(id) { currentProject = id; renderProjectDetail(id); }

function renderProjectDetail(id) {
  const p = PROJECTS.find(x => x.id === id);
  const all = TASKS.filter(t => t.project === id);
  const open = all.filter(t => !t.done);
  const doneT = all.filter(t => t.done);
  const urgent = open.filter(t => t.urgency === 'urgent');
  const soon = open.filter(t => t.urgency === 'soon');
  const later = open.filter(t => t.urgency === 'later');
  let html = `<button class="back-btn" onclick="closeProject()">← All projects</button>
  <div class="detail-title">${p.name}</div>
  <div class="detail-meta">${p.date} · ${open.length} open · ${doneT.length} done</div>`;
  if (urgent.length) { html += sectionRule('Urgent', urgent.length); urgent.forEach(t => html += taskCard(t)); }
  if (soon.length) { html += sectionRule('Coming up', soon.length); soon.forEach(t => html += taskCard(t)); }
  if (later.length) { html += sectionRule('Later', later.length); later.forEach(t => html += taskCard(t)); }
  if (doneT.length) { html += sectionRule('Done', doneT.length); doneT.forEach(t => html += taskCard(t)); }
  if (!all.length) html += '<p class="empty">No tasks yet.</p>';
  document.getElementById('view-projects').innerHTML = html;
}

function closeProject() { currentProject = null; renderProjects(); }

function renderPriority() {
  const open = TASKS.filter(t => !t.done);
  const urgent = open.filter(t => t.urgency === 'urgent');
  const soon = open.filter(t => t.urgency === 'soon');
  const later = open.filter(t => t.urgency === 'later');
  let html = '';
  if (urgent.length) { html+=`<div class="priority-section"><div class="priority-header ph-urgent">This weekend <span class="pill-count">${urgent.length}</span></div>`; urgent.forEach(t=>html+=taskCard(t)); html+='</div>'; }
  if (soon.length) { html+=`<div class="priority-section"><div class="priority-header ph-soon">Coming up <span class="pill-count">${soon.length}</span></div>`; soon.forEach(t=>html+=taskCard(t)); html+='</div>'; }
  if (later.length) { html+=`<div class="priority-section"><div class="priority-header ph-later">Later <span class="pill-count">${later.length}</span></div>`; later.forEach(t=>html+=taskCard(t)); html+='</div>'; }
  if (!html) html = '<p class="empty">Nothing open right now.</p>';
  document.getElementById('view-priority').innerHTML = html;
}

function renderCompleted() {
  const doneItems = TASKS.filter(t => t.done);
  let html = '';
  if (!doneItems.length) html = '<p class="empty">Nothing checked off yet — go get something done.</p>';
  else { html += sectionRule('Completed', doneItems.length); doneItems.forEach(t => html += taskCard(t)); }
  document.getElementById('view-completed').innerHTML = html;
}

function setView(view, btn) {
  currentView = view; currentProject = null;
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  ['schedule','projects','priority','completed'].forEach(v => {
    document.getElementById('view-' + v).style.display = v === view ? 'block' : 'none';
  });
  renderCurrentView();
}

function renderCurrentView() {
  if (currentView === 'schedule') renderSchedule();
  else if (currentView === 'projects') renderProjects();
  else if (currentView === 'priority') renderPriority();
  else if (currentView === 'completed') renderCompleted();
}

loadTasks();
</script>
</body>
</html>
